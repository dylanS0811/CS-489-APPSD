apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs489-appsd
  namespace: cs489-lab10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs489-appsd
  template:
    metadata:
      labels:
        app: cs489-appsd
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: LAB6_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql -uroot -p"$LAB6_DB_PASSWORD" --silent; do sleep 2; done
      containers:
        - name: cs489-appsd
          image: cs489-appsd:lab10
          imagePullPolicy: IfNotPresent
          env:
            - name: LAB6_DB_URL
              value: jdbc:mysql://mysql:3306/cs489_apsd_lab6_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Chicago
            - name: LAB6_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: LAB6_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75.0
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cs489-appsd
  namespace: cs489-lab10
spec:
  type: LoadBalancer
  selector:
    app: cs489-appsd
  ports:
    - name: http
      port: 8080
      targetPort: 8080
