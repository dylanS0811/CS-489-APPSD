services:
  mysql:
    image: mysql:8.4
    container_name: cs489-lab10-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: cs489_apsd_lab6_db
    ports:
      - "3307:3306"
    volumes:
      - cs489-lab10-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  cs489-appsd:
    build:
      context: .
    image: cs489-appsd:lab10
    container_name: cs489-lab10-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LAB6_DB_URL: jdbc:mysql://mysql:3306/cs489_apsd_lab6_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Chicago
      LAB6_DB_USERNAME: root
      LAB6_DB_PASSWORD: 123456
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0
    ports:
      - "8080:8080"

volumes:
  cs489-lab10-mysql-data:
