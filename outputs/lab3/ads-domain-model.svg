<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #17324d; }
      .class-name { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .attr { font: 15px Arial, sans-serif; fill: #1f2933; }
      .label { font: 14px Arial, sans-serif; fill: #334e68; }
      .mult { font: 13px Arial, sans-serif; fill: #102a43; }
      .note-text { font: 14px Arial, sans-serif; fill: #5c3d00; }
      .box { fill: #f8fbff; stroke: #1f4e79; stroke-width: 2; rx: 10; ry: 10; }
      .header { fill: #d9ecff; stroke: #1f4e79; stroke-width: 2; }
      .divider { stroke: #1f4e79; stroke-width: 1.5; }
      .assoc { stroke: #556b85; stroke-width: 2.2; fill: none; }
      .note { fill: #fff4cf; stroke: #b58105; stroke-width: 2; rx: 10; ry: 10; }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <text class="title" x="800" y="34" text-anchor="middle">Advantis Dental Surgeries (ADS) Domain Model</text>

  <g transform="translate(520 50)">
    <rect class="box" width="560" height="140"/>
    <rect class="header" width="560" height="38"/>
    <line class="divider" x1="0" y1="38" x2="560" y2="38"/>
    <text class="class-name" x="280" y="25" text-anchor="middle">Person</text>
    <text class="attr" x="18" y="64">- firstName : String</text>
    <text class="attr" x="18" y="90">- lastName : String</text>
    <text class="attr" x="18" y="116">- phoneNumber : String</text>
    <text class="attr" x="290" y="64">- email : String</text>
  </g>

  <g transform="translate(140 250)">
    <rect class="box" width="260" height="120"/>
    <rect class="header" width="260" height="38"/>
    <line class="divider" x1="0" y1="38" x2="260" y2="38"/>
    <text class="class-name" x="130" y="25" text-anchor="middle">OfficeManager</text>
    <text class="attr" x="16" y="68">- officeManagerId : long</text>
  </g>

  <g transform="translate(550 250)">
    <rect class="box" width="270" height="130"/>
    <rect class="header" width="270" height="38"/>
    <line class="divider" x1="0" y1="38" x2="270" y2="38"/>
    <text class="class-name" x="135" y="25" text-anchor="middle">Dentist</text>
    <text class="attr" x="16" y="68">- dentistId : long</text>
    <text class="attr" x="16" y="94">- specialization : String</text>
  </g>

  <g transform="translate(950 250)">
    <rect class="box" width="290" height="145"/>
    <rect class="header" width="290" height="38"/>
    <line class="divider" x1="0" y1="38" x2="290" y2="38"/>
    <text class="class-name" x="145" y="25" text-anchor="middle">Patient</text>
    <text class="attr" x="16" y="66">- patientId : long</text>
    <text class="attr" x="16" y="92">- mailingAddress : String</text>
    <text class="attr" x="16" y="118">- dateOfBirth : LocalDate</text>
  </g>

  <g transform="translate(130 500)">
    <rect class="box" width="320" height="175"/>
    <rect class="header" width="320" height="38"/>
    <line class="divider" x1="0" y1="38" x2="320" y2="38"/>
    <text class="class-name" x="160" y="25" text-anchor="middle">AppointmentRequest</text>
    <text class="attr" x="16" y="64">- requestId : long</text>
    <text class="attr" x="16" y="88">- requestChannel : RequestChannel</text>
    <text class="attr" x="16" y="112">- requestType : RequestType</text>
    <text class="attr" x="16" y="136">- preferredDateTime : LocalDateTime</text>
    <text class="attr" x="16" y="160">- status : RequestStatus</text>
  </g>

  <g transform="translate(550 500)">
    <rect class="box" width="340" height="155"/>
    <rect class="header" width="340" height="38"/>
    <line class="divider" x1="0" y1="38" x2="340" y2="38"/>
    <text class="class-name" x="170" y="25" text-anchor="middle">Appointment</text>
    <text class="attr" x="16" y="64">- appointmentId : long</text>
    <text class="attr" x="16" y="88">- appointmentDateTime : LocalDateTime</text>
    <text class="attr" x="16" y="112">- status : AppointmentStatus</text>
    <text class="attr" x="16" y="136">- confirmationEmailSent : boolean</text>
  </g>

  <g transform="translate(1010 500)">
    <rect class="box" width="300" height="135"/>
    <rect class="header" width="300" height="38"/>
    <line class="divider" x1="0" y1="38" x2="300" y2="38"/>
    <text class="class-name" x="150" y="25" text-anchor="middle">Surgery</text>
    <text class="attr" x="16" y="64">- surgeryId : long</text>
    <text class="attr" x="16" y="88">- name : String</text>
    <text class="attr" x="16" y="112">- locationAddress : String</text>
    <text class="attr" x="16" y="136">- telephoneNumber : String</text>
  </g>

  <g transform="translate(1020 745)">
    <rect class="box" width="320" height="175"/>
    <rect class="header" width="320" height="38"/>
    <line class="divider" x1="0" y1="38" x2="320" y2="38"/>
    <text class="class-name" x="160" y="25" text-anchor="middle">DentalServiceBill</text>
    <text class="attr" x="16" y="64">- billId : long</text>
    <text class="attr" x="16" y="88">- issueDate : LocalDate</text>
    <text class="attr" x="16" y="112">- amount : BigDecimal</text>
    <text class="attr" x="16" y="136">- status : BillStatus</text>
    <text class="attr" x="16" y="160">- description : String</text>
  </g>

  <g transform="translate(120 760)">
    <rect class="note" width="360" height="100"/>
    <text class="note-text" x="20" y="32">Constraint:</text>
    <text class="note-text" x="20" y="58">A patient with an outstanding unpaid</text>
    <text class="note-text" x="20" y="82">bill cannot request a new appointment.</text>
  </g>

  <g transform="translate(540 760)">
    <rect class="note" width="380" height="100"/>
    <text class="note-text" x="20" y="32">Constraint:</text>
    <text class="note-text" x="20" y="58">A dentist cannot be assigned more than</text>
    <text class="note-text" x="20" y="82">5 appointments in any given week.</text>
  </g>

  <line class="assoc" x1="270" y1="250" x2="650" y2="190"/>
  <polygon points="650,190 636,196 642,182" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>

  <line class="assoc" x1="685" y1="250" x2="800" y2="190"/>
  <polygon points="800,190 786,196 792,182" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>

  <line class="assoc" x1="1095" y1="250" x2="950" y2="190"/>
  <polygon points="950,190 964,196 958,182" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>

  <line class="assoc" x1="290" y1="500" x2="290" y2="395"/>
  <text class="label" x="302" y="448">processes</text>
  <text class="mult" x="266" y="484">0..*</text>
  <text class="mult" x="252" y="412">0..1</text>

  <line class="assoc" x1="400" y1="334" x2="550" y2="550"/>
  <text class="label" x="435" y="430">books</text>
  <text class="mult" x="392" y="352">1</text>
  <text class="mult" x="528" y="540">0..*</text>

  <line class="assoc" x1="950" y1="335" x2="890" y2="575"/>
  <text class="label" x="905" y="440">has</text>
  <text class="mult" x="930" y="356">1</text>
  <text class="mult" x="900" y="558">0..*</text>

  <polyline class="assoc" points="450,520 500,520 500,450 920,450 920,360 950,360"/>
  <text class="label" x="690" y="432">submittedBy</text>
  <text class="mult" x="430" y="512">0..*</text>
  <text class="mult" x="924" y="350">1</text>

  <line class="assoc" x1="820" y1="565" x2="1010" y2="565"/>
  <text class="label" x="887" y="548">scheduledAt</text>
  <text class="mult" x="836" y="558">0..*</text>
  <text class="mult" x="982" y="558">1</text>

  <line class="assoc" x1="685" y1="380" x2="720" y2="500"/>
  <text class="label" x="728" y="435">treats</text>
  <text class="mult" x="664" y="394">1</text>
  <text class="mult" x="726" y="488">0..*</text>

  <line class="assoc" x1="450" y1="575" x2="550" y2="575"/>
  <text class="label" x="468" y="556">resultsIn</text>
  <text class="mult" x="460" y="568">0..*</text>
  <text class="mult" x="526" y="568">0..1</text>

  <polyline class="assoc" points="720,655 720,720 1020,720 1020,780"/>
  <text class="label" x="824" y="701">generates</text>
  <text class="mult" x="696" y="648">0..1</text>
  <text class="mult" x="996" y="770">0..1</text>

  <polyline class="assoc" points="1240,325 1400,325 1400,820 1340,820"/>
  <text class="label" x="1320" y="306">owes</text>
  <text class="mult" x="1218" y="316">1</text>
  <text class="mult" x="1350" y="804">0..*</text>

  <line class="assoc dash" x1="300" y1="760" x2="300" y2="655"/>
  <line class="assoc dash" x1="730" y1="760" x2="730" y2="655"/>
</svg>
