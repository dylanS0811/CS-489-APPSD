  <text class="small" x="960" y="522" text-anchor="middle">Management Service</text>

  <text class="box-title" x="1200" y="500" text-anchor="middle">Dentist</text>
  <text class="small" x="1200" y="522" text-anchor="middle">Management Service</text>

  <text class="box-title" x="960" y="590" text-anchor="middle">Appointment</text>
  <text class="small" x="960" y="612" text-anchor="middle">Scheduling Service</text>

  <text class="box-title" x="1200" y="590" text-anchor="middle">Billing and</text>
  <text class="small" x="1200" y="612" text-anchor="middle">Outstanding Balance Service</text>

  <text class="box-title" x="1080" y="675" text-anchor="middle">Notification /</text>
  <text class="small" x="1080" y="697" text-anchor="middle">Email Service</text>

  <rect class="panel-alt" x="820" y="744" width="560" height="62"/>
  <text class="box-title" x="1100" y="770" text-anchor="middle">Persistence Layer</text>
  <text class="box-text" x="1100" y="794" text-anchor="middle">Spring Data JPA Repositories and Transaction Management</text>

  <rect class="panel" x="1140" y="824" width="190" height="40"/>
  <text class="box-text" x="1235" y="849" text-anchor="middle">Hibernate ORM</text>

  <rect class="panel-alt" x="760" y="884" width="720" height="136"/>
  <text class="box-title" x="1120" y="918" text-anchor="middle">Data and External Services</text>

  <rect class="panel" x="820" y="948" width="220" height="52"/>
  <rect class="panel" x="1080" y="948" width="220" height="52"/>

