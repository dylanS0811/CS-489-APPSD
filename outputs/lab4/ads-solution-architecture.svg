  <text class="box-title" x="140" y="538" text-anchor="middle">Server</text>
  <text class="box-text" x="140" y="572" text-anchor="middle">Spring Boot</text>
  <text class="box-text" x="140" y="596" text-anchor="middle">REST API</text>
  <text class="box-text" x="140" y="620" text-anchor="middle">Business Services</text>
  <text class="box-text" x="140" y="644" text-anchor="middle">Persistence</text>

  <rect class="tier-box" x="40" y="820" width="200" height="205"/>
  <text class="box-title" x="140" y="854" text-anchor="middle">Data / Integration Tier</text>
  <rect class="panel-alt" x="60" y="892" width="75" height="72"/>
  <rect class="panel-alt" x="145" y="892" width="75" height="72"/>
  <text class="box-text" x="97" y="926" text-anchor="middle">PostgreSQL</text>
