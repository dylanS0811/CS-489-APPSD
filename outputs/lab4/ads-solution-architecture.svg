  <text class="tier-label" x="140" y="104" text-anchor="middle">Physical Tiers</text>
  <text class="tier-label" x="930" y="104" text-anchor="middle">Logical Tiers and Layers</text>

  <rect class="tier-box" x="40" y="130" width="200" height="245"/>
  <text class="box-title" x="140" y="164" text-anchor="middle">Client Tier</text>
  <rect class="panel-alt" x="72" y="190" width="136" height="70"/>
  <text class="box-title" x="140" y="220" text-anchor="middle">Browser</text>
  <text class="box-text" x="140" y="245" text-anchor="middle">Angular SPA</text>
  <text class="small" x="140" y="292" text-anchor="middle">Office Manager | Dentist</text>
  <text class="small" x="140" y="312" text-anchor="middle">Patient</text>

  <rect class="tier-box" x="40" y="405" width="200" height="355"/>
