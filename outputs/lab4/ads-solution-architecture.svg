  <text class="box-title" x="1190" y="978" text-anchor="middle">SMTP Email Gateway</text>

  <rect class="note" x="330" y="390" width="320" height="112"/>
  <text class="box-title" x="490" y="426" text-anchor="middle">Architecture Choice</text>
  <text class="box-text" x="490" y="454" text-anchor="middle">3-tier web architecture</text>
  <text class="box-text" x="490" y="480" text-anchor="middle">Layered modular monolith</text>

  <line class="arrow" x1="650" y1="260" x2="820" y2="338"/>
  <text class="label" x="706" y="226">HTTPS / JSON</text>

  <line class="arrow" x1="930" y1="806" x2="930" y2="948"/>
  <text class="label" x="946" y="882">JPA / SQL</text>

  <polyline class="arrow" points="1210,678 1420,678 1420,920 1190,920 1190,948"/>
  <text class="label" x="1310" y="658">SMTP</text>

  <line class="arrow" x1="208" y1="225" x2="330" y2="225"/>
  <line class="arrow" x1="208" y1="570" x2="760" y2="570"/>
  <line class="arrow" x1="220" y1="928" x2="760" y2="928"/>
</svg>
