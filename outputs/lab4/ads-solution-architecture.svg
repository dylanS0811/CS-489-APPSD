<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 16px Arial, sans-serif; fill: #486581; }
      .tier-label { font: 700 20px Arial, sans-serif; fill: #102a43; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .box-text { font: 15px Arial, sans-serif; fill: #243b53; }
      .small { font: 14px Arial, sans-serif; fill: #486581; }
      .tier-box { fill: none; stroke: #8aa4bf; stroke-width: 2; stroke-dasharray: 8 6; rx: 12; ry: 12; }
      .panel { fill: #f8fbff; stroke: #35608a; stroke-width: 2; rx: 12; ry: 12; }
      .panel-alt { fill: #eef6ff; stroke: #35608a; stroke-width: 2; rx: 12; ry: 12; }
      .header { fill: #dbeafe; stroke: #35608a; stroke-width: 2; }
      .divider { stroke: #35608a; stroke-width: 1.5; }
      .arrow { stroke: #4b647d; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .label { font: 14px Arial, sans-serif; fill: #334e68; }
      .note { fill: #fff7db; stroke: #d4a72c; stroke-width: 2; rx: 10; ry: 10; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#4b647d"/>
    </marker>
  </defs>

