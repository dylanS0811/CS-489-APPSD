  <text class="box-text" x="1100" y="350" text-anchor="middle">Spring Boot REST API, Spring MVC Controllers, DTO mapping, validation</text>

  <rect class="panel-alt" x="820" y="415" width="560" height="300"/>
  <text class="box-title" x="1100" y="448" text-anchor="middle">Business Service Layer</text>

  <rect class="panel" x="850" y="470" width="220" height="72"/>
  <rect class="panel" x="1090" y="470" width="220" height="72"/>
  <rect class="panel" x="850" y="560" width="220" height="72"/>
  <rect class="panel" x="1090" y="560" width="220" height="72"/>
  <rect class="panel" x="950" y="646" width="260" height="64"/>

